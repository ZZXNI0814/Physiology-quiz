<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방사선학과 의학용어 랜덤 퀴즈</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .quiz-container { background-color: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 90%; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 20px; word-break: keep-all; }
        .question { font-size: 20px; font-weight: bold; color: #34495e; margin-bottom: 30px; min-height: 60px; word-break: keep-all; }
        .answer { font-size: 22px; font-weight: bold; color: #e74c3c; margin-bottom: 30px; min-height: 35px; display: none; }
        .btn { background-color: #3498db; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 8px; cursor: pointer; margin: 5px; transition: background 0.3s; }
        .btn:hover { background-color: #2980b9; }
        .btn-next { background-color: #2ecc71; }
        .btn-next:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>📝 해부학 & 방사선 촬영 자세 랜덤 퀴즈</h1>
    <div id="question" class="question">문제를 불러오는 중...</div>
    <div id="answer" class="answer"></div>
    <button class="btn" onclick="showAnswer()">정답 보기</button>
    <button class="btn btn-next" onclick="nextQuestion()">다음 문제 ➡</button>
</div>

<script>
    const quizData = [
        // 기존 데이터
        { q: "무디게 두드러진 부분", a: "융기 (eminence)" },
        { q: "예리한 돌기 부분", a: "가시 (극, spine)" },
        { q: "표면에서 많이 튀어나온 부분", a: "돌기 (process)" },
        { q: "혹과 같이 두드러진 부분", a: "결절 (tubercle)" },
        { q: "뚝과 같이 길게 두드러진 부분", a: "능선 (능, crest, ridge)" },
        { q: "끝의 표면이 뭉뚝한 부분", a: "관절융기 (과, condyle)" },
        { q: "표면이 거친부분", a: "거친면 (조면, tuberosity)" },
        { q: "표면이 오목한 부분", a: "오목 (와, fossa)" },
        { q: "고랑과 같이 길게 파인 부분", a: "고랑 (구, sulcus, groove)" },
        { q: "파인 부분", a: "패임 (절흔, incisure, notch)" },
        { q: "좁은 틈새부분", a: "틈새 (열, fissure)" },
        { q: "작게 뚫린 구멍", a: "구멍 (공, foramen)" },
        { q: "크고 작은 많은 관", a: "굴 (관, canal)" },
        { q: "굵은 관", a: "길 (도, meatus)" },
        { q: "머리뼈 속의 공간이며 뇌가 들어있다.", a: "머리안 (두개강, cranial cavity)" },
        { q: "척수안은 머리안의 연속이며 척수가 들어있다.", a: "척수안 (척수강, spinal cavity)" },
        { q: "허파(폐), 심장, 식도 등이 있는 공간", a: "가슴안 (흉강, thoracic cavity)" },
        { q: "간(liver), 쓸개(gallbladder), 위(stomach) 등이 있는 부위", a: "배안 (복강, abdominal cavity)" },
        { q: "방광, 자궁, 직장 등이 있는 공간", a: "골반안 (골반강, pelvic cavity)" },
        { q: "인체를 앞 뒤면으로 2등분하는 면이다.", a: "이마선, 면 (관상면, coronal plane)" },
        { q: "해부학적 자세에서 좌우방향인 시상으로 절단하였을 때 생기는 정중선에 평행인 선 또는 면", a: "시상선, 면 (sagittal line, plane)" },
        { q: "몸통 중심에 가까운쪽, 또는 정중선에 가까운 쪽", a: "안쪽 (내측, medial)" },
        { q: "몸통 중심으로부터 먼쪽 또는 정중선에서 먼쪽", a: "가쪽 (외측, lateral)" },
        { q: "몸통에 가까운 쪽이다.", a: "몸쪽 (근위, proximal)" },
        { q: "몸통에서 먼 쪽이다.", a: "먼쪽 (원위, distal)" },
        { q: "몸통에서 팔·다리가 멀어지게 하는 운동이다.", a: "벌림 (외전, abduction)" },
        { q: "몸통에 팔 다리를 근접시키는 운동이다.", a: "모음 (내전, adduction)" },
        { q: "굽힘의 반대로서, 관절부위를 똑바로 펴는 자세이다.", a: "폄 (신전, extension)" },
        { q: "폄의 반대로서, 관절을 이루는 각도를 작게하는 운동이다.", a: "굽힘 (굴곡, flexion)" },
        { q: "손바닥이 아래나 뒤쪽으로 놓이도록 손을 안쪽으로 돌리는 운동", a: "엎침 (회내, pronation)" },
        { q: "손바닥이 위나 앞쪽으로 놓이도록 손을 바깥쪽으로 돌리는 운동", a: "뒤침 (회외, supination)" },
        { q: "발을 바깥쪽으로 비틀어 돌려 뒤집는 운동이다.", a: "가쪽번짐 (외번, eversion)" },
        { q: "발을 안쪽으로 비틀어 돌려 뒤집는 운동이다.", a: "안쪽번짐 (내번, inversion)" },
        { q: "손등이나 발등쪽으로 구부리는 운동이다.", a: "등쪽굽힘 (배측굴곡, dorsi flexion)" },
        { q: "발바닥쪽으로 구부리는 운동이다.", a: "발바닥굽힘 (족저굴곡, plantar flexion)" },
        { q: "몸통 오른쪽의 앞면을 IR면에 밀착시켜 45° 정도 기울여 놓은 자세이다.", a: "RAO자세 (right anterior oblique position)" },
        { q: "몸통 왼쪽의 앞면을 IR면에 밀착시켜 45° 정도 기울여 놓은 자세이다.", a: "LAO자세 (left anterior oblique position)" },
        { q: "엑스선 중심선속이 인체의 전면으로 입사되어 후면으로 나아가는 촬영 방법이다.", a: "전후방향 촬영 (AP projection)" },
        { q: "엑스선 중심선속이 인체의 후면으로 입사되어 전면으로 나아가는 촬영 방법이다.", a: "후전방향 촬영 (PA projection)" },
        { q: "바로 누운자세에서 머리쪽보다 발쪽을 더 높게 하는 자세이다.", a: "Trendelenburg 자세" },
        { q: "바로 누운자세에서 머리쪽보다 발쪽을 더 낮게 하는 자세이다.", a: "Fowler 자세" },
        // 새로 추가된 데이터
        { q: "환자를 누운자세로 하고, 카세트를 수직으로 세워 놓고, 엑스선 중심선 속을 수평입사하는 촬영방법", a: "수평방향 촬영 (decubitus projection)" },
        { q: "환자는 우측 옆으로 누운자세 또는 좌측 옆으로 누운자세로 하는 수평방향 촬영", a: "옆으로 누운 수평방향 촬영 (lateral decubitus projection)" },
        { q: "환자는 바로 누운자세로 하는 수평방향 촬영", a: "바로 누운 수평방향 촬영 (dorsal decubitus projection)" },
        { q: "환자는 엎드린자세로 하는 수평방향 촬영", a: "엎드린 수평방향 촬영 (ventral decubitus projection)" },
        { q: "특정한 뼈구조의 반측면상을 얻기 위하여 엑스선 중심선을 신체 표면에 근접시켜 겹침없는 영상을 얻는 촬영방법", a: "접선방향 촬영 (tangential projection)" },
        { q: "엑스선 중심선속이 신체부위의 세로축을 따라서 머리쪽으로 또는 발쪽으로 경사지게 입사하는 촬영", a: "축방향 촬영 (axial projection)" },
        { q: "위에서 아래로 (머리쪽에서 발쪽으로) 경사지게 입사하는 축방향 촬영", a: "상·하축방향 촬영 (supero - inferior axial projection)" },
        { q: "아래에서 위로 (발쪽에서 머리쪽으로) 경사지게 입사하는 축방향 촬영", a: "하·상축방향 촬영 (infero - superior axial projection)" },
        { q: "흉부 lordotic position을 말하는 축방향 촬영", a: "흉부 전후 축방향 촬영 (chest AP axial projection)" },
        { q: "안쪽에서 바깥쪽으로 향하는 촬영", a: "내·외방향 촬영 (medio-lateral projection)" },
        { q: "바깥쪽에서 안쪽으로 향하는 촬영", a: "외·내방향 촬영 (latero-medial projection)" }
    ];

    let currentQuestion = {};

    function nextQuestion() {
        const randomIndex = Math.floor(Math.random() * quizData.length);
        currentQuestion = quizData[randomIndex];
        document.getElementById('question').innerText = currentQuestion.q;
        document.getElementById('answer').style.display = 'none';
        document.getElementById('answer').innerText = currentQuestion.a;
    }

    function showAnswer() {
        document.getElementById('answer').style.display = 'block';
    }

    window.onload = nextQuestion;
</script>

</body>
</html>
